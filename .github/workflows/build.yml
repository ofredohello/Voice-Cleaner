name: Compiler le plugin Mac

# Se lance tout seul a chaque modification, ou a la main (onglet Actions > Run workflow)
on:
  push:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-15-intel
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      # Plugin "universel" : fonctionne sur Mac Apple Silicon (M1/M2/M3/M4) et Mac Intel
      - name: Configurer
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Compiler
        run: cmake --build build --config Release --parallel 4

      - name: Rassembler les fichiers a telecharger
        run: |
          mkdir dist
          find build -type d -name "*.vst3" -prune -exec cp -R {} dist/ \;
          find build -type d -name "*.component" -prune -exec cp -R {} dist/ \;
          find build -type d -name "*.app" -prune -exec cp -R {} dist/ \;
          ls -la dist
          if ! ls dist | grep -q "vst3"; then echo "Aucun plugin .vst3 trouve"; exit 1; fi
          for b in dist/*; do codesign --force --deep -s - "$b"; done
          ditto -c -k --keepParent dist Voice-Cleaner-Mac.zip

      - name: Publier le resultat
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Cleaner-Mac
          path: Voice-Cleaner-Mac.zip
          if-no-files-found: error
