name: Compiler le plugin (Mac et Windows)

# Se lance tout seul a chaque modification, ou a la main (onglet Actions > Run workflow)
on:
  push:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-15-intel
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Configurer
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Compiler
        run: cmake --build build --config Release --parallel 4

      - name: Rassembler les fichiers a telecharger
        run: |
          mkdir dist
          find build -type d -name "*.vst3" -prune -exec cp -R {} dist/ \;
          find build -type d -name "*.component" -prune -exec cp -R {} dist/ \;
          find build -type d -name "*.app" -prune -exec cp -R {} dist/ \;
          ls -la dist
          if ! ls dist | grep -q "vst3"; then echo "Aucun plugin .vst3 trouve"; exit 1; fi
          for b in dist/*; do codesign --force --deep -s - "$b"; done
          ditto -c -k --keepParent dist Voice-Cleaner-Mac.zip

      - name: Publier le resultat
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Cleaner-Mac
          path: Voice-Cleaner-Mac.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Preparer l'environnement
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurer
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Rassembler les fichiers a telecharger
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination dist -Recurse
          }
          Get-ChildItem -Path build -Recurse -File -Filter "*.exe" |
            Where-Object { $_.FullName -match "Standalone" } |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination dist }
          if (-not (Get-ChildItem -Path dist -Filter "*.vst3")) { throw "Aucun plugin .vst3 trouve" }

      - name: Publier le resultat
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Cleaner-Windows
          path: dist
          if-no-files-found: error
